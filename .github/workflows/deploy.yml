name: Build & Deploy

# 手动触发:GitHub 网页 → Actions → "Build & Deploy" → Run workflow
on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制重建两个镜像(忽略内容 tag 已存在;用于吃基础镜像安全更新)'
        required: false
        type: boolean
        default: false

# 同分支新触发时取消旧的，不排队等待（仅限构建阶段）
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_REGISTRY: ghcr.io/matgo-dev/buildreach
  ACR_REGISTRY: crpi-mduxqqlcuiv1a644.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_IMAGE_REGISTRY: crpi-mduxqqlcuiv1a644.cn-hangzhou.personal.cr.aliyuncs.com/buildlink01

jobs:
  # ── 迁移安全检查 ──
  check-migration:
    name: 迁移安全检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检查破坏性迁移
        run: |
          if git log -1 --pretty=%B | grep -q '\[allow-destructive-migration\]'; then
            echo "已授权破坏性迁移,跳过检查"
            exit 0
          fi
          bash deploy/check-migration-safety.sh

  # ── 构建镜像并推送到 GHCR + ACR ──
  build:
    name: 构建并推送镜像
    needs: check-migration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      backend_tag: ${{ steps.meta.outputs.backend_tag }}
      frontend_tag: ${{ steps.meta.outputs.frontend_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 按目录算"最后一次改到该目录的 commit"需要完整历史
          fetch-depth: 0

      - name: 计算镜像 Tag
        id: meta
        env:
          RAW_BRANCH: ${{ github.ref_name }}
          FRONTEND_BUILD_ARGS: NEXT_PUBLIC_DEMO_EMAILS=${{ vars.DEMO_EMAILS }}
        run: |
          BRANCH=$(printf '%s' "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//; s/-+/-/g' | cut -c1-80)
          if [ -z "$BRANCH" ]; then
            BRANCH=ref
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # 本次运行的 tag(回滚/Deploy Only 用,两个服务都打)
          IMAGE_TAG="${BRANCH}-${SHORT_SHA}"
          LATEST_TAG="${BRANCH}-latest"
          # 按服务的内容 tag:取最后一次改到该目录的 commit。
          # 目录没改 → tag 不变 → 服务器上 compose 看到镜像名没变就不重建该容器,
          # 只改前端不会重启后端(反之亦然)。
          # 进镜像内容的输入都要进 tag:目录 commit + 影响产物的 build-arg。
          # backend 的 BUILD_COMMIT/BUILD_TIME 等只是元数据,刻意不算(算了就永远重建)。
          # 基础镜像(FROM 的 tag)更新不在 tag 里,要吃安全补丁用 force_rebuild 输入。
          BACKEND_SHA=$(git log -1 --format=%h --abbrev=7 -- backend)
          FRONTEND_SHA=$(git log -1 --format=%h --abbrev=7 -- frontend)
          FRONTEND_ARGS_HASH=$(printf '%s' "$FRONTEND_BUILD_ARGS" | sha256sum | cut -c1-6)
          BACKEND_TAG="${BRANCH}-${BACKEND_SHA}"
          FRONTEND_TAG="${BRANCH}-${FRONTEND_SHA}-a${FRONTEND_ARGS_HASH}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "backend_tag=$BACKEND_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$FRONTEND_TAG" >> "$GITHUB_OUTPUT"
          echo "运行 Tag: $IMAGE_TAG / $LATEST_TAG"
          echo "backend  内容 Tag: $BACKEND_TAG"
          echo "frontend 内容 Tag: $FRONTEND_TAG"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 检查内容 Tag 是否已在两个仓库
        id: exists
        env:
          BACKEND_TAG: ${{ steps.meta.outputs.backend_tag }}
          FRONTEND_TAG: ${{ steps.meta.outputs.frontend_tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          # 两个仓库(GHCR 给 OVH,ACR 给 ECS)都有才算存在;缺任一就重新构建推送
          check() {
            local svc="$1" tag="$2"
            if [ "$FORCE_REBUILD" = "true" ]; then
              echo "$svc=false" >> "$GITHUB_OUTPUT"
              echo "$svc:$tag force_rebuild=true,强制构建"
              return
            fi
            if docker buildx imagetools inspect "$IMAGE_REGISTRY/$svc:$tag" > /dev/null 2>&1 \
               && docker buildx imagetools inspect "$ACR_IMAGE_REGISTRY/$svc:$tag" > /dev/null 2>&1; then
              echo "$svc=true" >> "$GITHUB_OUTPUT"
              echo "$svc:$tag 已存在,跳过构建"
            else
              echo "$svc=false" >> "$GITHUB_OUTPUT"
              echo "$svc:$tag 不存在,需要构建"
            fi
          }
          check backend "$BACKEND_TAG"
          check frontend "$FRONTEND_TAG"

      - name: 生成构建时间戳
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: 构建并推送 backend 镜像
        if: steps.exists.outputs.backend == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/backend:${{ steps.meta.outputs.backend_tag }}
            ${{ env.IMAGE_REGISTRY }}/backend:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_REGISTRY }}/backend:${{ steps.meta.outputs.latest_tag }}
            ${{ env.ACR_IMAGE_REGISTRY }}/backend:${{ steps.meta.outputs.backend_tag }}
            ${{ env.ACR_IMAGE_REGISTRY }}/backend:${{ steps.meta.outputs.image_tag }}
            ${{ env.ACR_IMAGE_REGISTRY }}/backend:${{ steps.meta.outputs.latest_tag }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=${{ github.ref_name }}
            BUILD_COMMIT_AUTHOR=${{ github.event.head_commit.author.name || github.actor }}
            BUILD_COMMIT_TIME=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          # 阿里云个人版 ACR 不认 provenance attestation 的 empty config
          # (application/vnd.oci.empty.v1+json)，推送会被 denied。关掉。
          provenance: false

      - name: 构建并推送 frontend 镜像
        if: steps.exists.outputs.frontend == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/frontend:${{ steps.meta.outputs.frontend_tag }}
            ${{ env.IMAGE_REGISTRY }}/frontend:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_REGISTRY }}/frontend:${{ steps.meta.outputs.latest_tag }}
            ${{ env.ACR_IMAGE_REGISTRY }}/frontend:${{ steps.meta.outputs.frontend_tag }}
            ${{ env.ACR_IMAGE_REGISTRY }}/frontend:${{ steps.meta.outputs.image_tag }}
            ${{ env.ACR_IMAGE_REGISTRY }}/frontend:${{ steps.meta.outputs.latest_tag }}
          build-args: |
            NEXT_PUBLIC_DEMO_EMAILS=${{ vars.DEMO_EMAILS }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          # 阿里云个人版 ACR 不认 provenance attestation 的 empty config
          # (application/vnd.oci.empty.v1+json)，推送会被 denied。关掉。
          provenance: false

      - name: 未重建的服务:把运行 Tag / latest 指到已有内容 Tag
        if: steps.exists.outputs.backend == 'true' || steps.exists.outputs.frontend == 'true'
        env:
          BACKEND_SKIPPED: ${{ steps.exists.outputs.backend }}
          FRONTEND_SKIPPED: ${{ steps.exists.outputs.frontend }}
          BACKEND_TAG: ${{ steps.meta.outputs.backend_tag }}
          FRONTEND_TAG: ${{ steps.meta.outputs.frontend_tag }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
        run: |
          # 只是在仓库侧给同一个 manifest 加 tag,不拉不推镜像层。
          # 这样 Deploy Only 用单个运行 Tag 回滚时两个服务都能找到镜像。
          retag() {
            local svc="$1" content_tag="$2"
            docker buildx imagetools create \
              -t "$IMAGE_REGISTRY/$svc:$IMAGE_TAG" \
              -t "$IMAGE_REGISTRY/$svc:$LATEST_TAG" \
              "$IMAGE_REGISTRY/$svc:$content_tag"
            # ACR 个人版对 manifest 操作较挑剔;失败只告警,ECS 部署用的是内容 Tag 不受影响
            docker buildx imagetools create \
              -t "$ACR_IMAGE_REGISTRY/$svc:$IMAGE_TAG" \
              -t "$ACR_IMAGE_REGISTRY/$svc:$LATEST_TAG" \
              "$ACR_IMAGE_REGISTRY/$svc:$content_tag" \
              || echo "::warning::ACR 上 $svc 的运行 Tag/latest 重打失败,内容 Tag $content_tag 仍可用"
          }
          if [ "$BACKEND_SKIPPED" = "true" ]; then retag backend "$BACKEND_TAG"; fi
          if [ "$FRONTEND_SKIPPED" = "true" ]; then retag frontend "$FRONTEND_TAG"; fi

  # ── 部署到 ECS（测试/预发环境，从 ACR 拉取）──
  deploy-ecs:
    name: 部署到 ECS (Staging)
    needs: build
    # 只在非 release 分支/tag 上部署到 staging（main / feature 等）
    if: ${{ !startsWith(github.ref_name, 'release-v') }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: 同步部署文件到 ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/buildreach_ecs
          chmod 600 ~/.ssh/buildreach_ecs
          ssh-keyscan -p 22 -H "$ECS_HOST" >> ~/.ssh/known_hosts
          tar -czf - deploy/deploy.sh docker-compose.production.yml | \
            ssh -i ~/.ssh/buildreach_ecs -p 22 "$ECS_USER@$ECS_HOST" \
              'cd /opt/buildreach && tar -xzf - && chmod +x deploy/deploy.sh'

      - name: SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script_stop: true
          script: |
            cd /opt/buildreach
            # ECS 这台机器上 :80 已被 fulfillment 的 vhost 占用(server_name 同为该 IP),
            # buildreach 走 :8080。端口必须带上,否则浏览器侧的 API 调用和 /static/ 图
            # 会打到 :80 → 进 fulfillment 那套。OVH 生产走 OVH_PUBLIC_ORIGIN,不受影响。
            DEPLOY_SKIP_CODE_UPDATE=1 \
            DEPLOY_REF=${{ github.sha }} \
            IMAGE_TAG=${{ needs.build.outputs.image_tag }} \
            BACKEND_IMAGE_TAG=${{ needs.build.outputs.backend_tag }} \
            FRONTEND_IMAGE_TAG=${{ needs.build.outputs.frontend_tag }} \
            IMAGE_REGISTRY=${{ env.ACR_IMAGE_REGISTRY }} \
            DEPLOY_API_BASE_URL=http://${{ secrets.ECS_HOST }}:8080 \
            DEPLOY_CORS_ORIGINS=http://${{ secrets.ECS_HOST }}:8080 \
              bash deploy/deploy.sh

      - name: 部署结果
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ ECS 部署成功"
            echo "   backend : ${{ needs.build.outputs.backend_tag }}"
            echo "   frontend: ${{ needs.build.outputs.frontend_tag }}"
            echo "   运行 Tag: ${{ needs.build.outputs.image_tag }}"
            echo "   地址: http://${{ secrets.ECS_HOST }}:8080"
          else
            echo "❌ ECS 部署失败"
          fi

  # ── 部署到 OVH（生产环境，从 GHCR 拉取）──
  deploy-ovh:
    name: 部署到 OVH (Production)
    needs: build
    # 生产只允许从 release-v* 分支/tag 部署，从机制上堵死 staging 误触生产
    if: ${{ startsWith(github.ref_name, 'release-v') }}
    runs-on: ubuntu-latest
    environment: production
    # 主机拉 GHCR 私有镜像用的是本次运行的 GITHUB_TOKEN,需要 packages 读权限
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        env:
          REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script_stop: true
          envs: REF
          script: |
            cd /opt/buildreach
            git fetch origin
            git reset --hard "origin/$REF"
            DEPLOY_REF="origin/$REF" \
            IMAGE_TAG=${{ needs.build.outputs.image_tag }} \
            BACKEND_IMAGE_TAG=${{ needs.build.outputs.backend_tag }} \
            FRONTEND_IMAGE_TAG=${{ needs.build.outputs.frontend_tag }} \
            GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            GHCR_USERNAME=${{ github.actor }} \
            DEPLOY_API_BASE_URL=${{ secrets.OVH_PUBLIC_ORIGIN }} \
            DEPLOY_CORS_ORIGINS=${{ secrets.OVH_PUBLIC_ORIGIN }} \
              bash deploy/deploy.sh

      - name: 部署结果
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ OVH 生产部署成功"
            echo "   backend : ${{ needs.build.outputs.backend_tag }}"
            echo "   frontend: ${{ needs.build.outputs.frontend_tag }}"
            echo "   运行 Tag: ${{ needs.build.outputs.image_tag }}"
          else
            echo "❌ OVH 生产部署失败"
          fi
