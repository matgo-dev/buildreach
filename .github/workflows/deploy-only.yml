name: Deploy Only (Re-deploy)

# 仅部署，跳过构建。用于镜像已构建成功但部署失败时手动重试。
# GitHub 网页 → Actions → "Deploy Only (Re-deploy)" → Run workflow
on:
  workflow_dispatch:
    inputs:
      target:
        description: '部署目标'
        required: true
        type: choice
        options:
          - ecs
          - ovh
          - both
        default: both
      image_tag:
        description: '两个服务同一个 tag(留空且下面两项也留空=所选分支的 <branch>-latest;整套回滚填运行 tag,如 release-v0.2.0-abc1234,两个容器都会重建)'
        required: false
        type: string
        default: ''
      backend_image_tag:
        description: '只换 backend:填内容 tag(Build & Deploy 结果里有);留空=backend 不动。填了就不能再填 image_tag'
        required: false
        type: string
        default: ''
      frontend_image_tag:
        description: '只换 frontend:同上'
        required: false
        type: string
        default: ''

env:
  IMAGE_REGISTRY: ghcr.io/matgo-dev/buildreach
  ACR_IMAGE_REGISTRY: crpi-mduxqqlcuiv1a644.cn-hangzhou.personal.cr.aliyuncs.com/buildlink01

jobs:
  resolve-tag:
    name: 解析镜像 Tag
    runs-on: ubuntu-latest
    outputs:
      backend_tag: ${{ steps.tag.outputs.backend_tag }}
      frontend_tag: ${{ steps.tag.outputs.frontend_tag }}
    steps:
      - name: 计算镜像 Tag
        id: tag
        env:
          RAW_BRANCH: ${{ github.ref_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_BACKEND_TAG: ${{ inputs.backend_image_tag }}
          INPUT_FRONTEND_TAG: ${{ inputs.frontend_image_tag }}
        run: |
          if [ -n "$INPUT_BACKEND_TAG" ] || [ -n "$INPUT_FRONTEND_TAG" ]; then
            # 单服务回滚:只换填了的那个,没填的传 current 让 deploy.sh 保留当前运行镜像
            if [ -n "$INPUT_IMAGE_TAG" ]; then
              echo "::error::image_tag 和 backend_image_tag/frontend_image_tag 不能同时填"
              exit 1
            fi
            BACKEND_TAG="${INPUT_BACKEND_TAG:-current}"
            FRONTEND_TAG="${INPUT_FRONTEND_TAG:-current}"
            echo "单服务部署: backend=$BACKEND_TAG, frontend=$FRONTEND_TAG"
          elif [ -n "$INPUT_IMAGE_TAG" ]; then
            # 手动指定运行 tag(整套回滚),直接用该 tag,不重新构建
            BACKEND_TAG="$INPUT_IMAGE_TAG"
            FRONTEND_TAG="$INPUT_IMAGE_TAG"
            echo "使用手动指定镜像 Tag(整套回滚): $INPUT_IMAGE_TAG"
          else
            BRANCH=$(printf '%s' "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//; s/-+/-/g' | cut -c1-80)
            if [ -z "$BRANCH" ]; then
              BRANCH=ref
            fi
            BACKEND_TAG="${BRANCH}-latest"
            FRONTEND_TAG="${BRANCH}-latest"
            echo "使用分支最新镜像 Tag: ${BRANCH}-latest"
          fi
          echo "backend_tag=$BACKEND_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$FRONTEND_TAG" >> "$GITHUB_OUTPUT"

  deploy-ecs:
    name: 部署到 ECS (Staging)
    needs: resolve-tag
    if: inputs.target == 'ecs' || inputs.target == 'both'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: 同步部署文件到 ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/buildreach_ecs
          chmod 600 ~/.ssh/buildreach_ecs
          ssh-keyscan -p 22 -H "$ECS_HOST" >> ~/.ssh/known_hosts
          tar -czf - deploy/deploy.sh docker-compose.production.yml | \
            ssh -i ~/.ssh/buildreach_ecs -p 22 "$ECS_USER@$ECS_HOST" \
              'cd /opt/buildreach && tar -xzf - && chmod +x deploy/deploy.sh'

      - name: SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        env:
          REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script_stop: true
          envs: REF
          script: |
            cd /opt/buildreach
            # ECS 这台机器上 :80 已被 fulfillment 的 vhost 占用(server_name 同为该 IP),
            # buildreach 走 :8080。端口必须带上,否则浏览器侧的 API 调用和 /static/ 图
            # 会打到 :80 → 进 fulfillment 那套。OVH 生产走 OVH_PUBLIC_ORIGIN,不受影响。
            DEPLOY_SKIP_CODE_UPDATE=1 \
            DEPLOY_REF="origin/$REF" \
            BACKEND_IMAGE_TAG=${{ needs.resolve-tag.outputs.backend_tag }} \
            FRONTEND_IMAGE_TAG=${{ needs.resolve-tag.outputs.frontend_tag }} \
            IMAGE_REGISTRY=${{ env.ACR_IMAGE_REGISTRY }} \
            DEPLOY_API_BASE_URL=http://${{ secrets.ECS_HOST }}:8080 \
            DEPLOY_CORS_ORIGINS=http://${{ secrets.ECS_HOST }}:8080 \
              bash deploy/deploy.sh

      - name: 部署结果
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ ECS 部署成功 (backend: ${{ needs.resolve-tag.outputs.backend_tag }}, frontend: ${{ needs.resolve-tag.outputs.frontend_tag }})"
          else
            echo "❌ ECS 部署失败"
          fi

  deploy-ovh:
    name: 部署到 OVH (Production)
    needs: resolve-tag
    # 生产只允许从 release-v* 分支/tag 重部署（即使选了 both，从 main 也不会误推生产）
    if: (inputs.target == 'ovh' || inputs.target == 'both') && startsWith(github.ref_name, 'release-v')
    runs-on: ubuntu-latest
    environment: production
    # 主机拉 GHCR 私有镜像用的是本次运行的 GITHUB_TOKEN,需要 packages 读权限
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        env:
          REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script_stop: true
          envs: REF
          script: |
            cd /opt/buildreach
            git fetch origin
            git reset --hard "origin/$REF"
            DEPLOY_REF="origin/$REF" \
            BACKEND_IMAGE_TAG=${{ needs.resolve-tag.outputs.backend_tag }} \
            FRONTEND_IMAGE_TAG=${{ needs.resolve-tag.outputs.frontend_tag }} \
            GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            GHCR_USERNAME=${{ github.actor }} \
            DEPLOY_API_BASE_URL=${{ secrets.OVH_PUBLIC_ORIGIN }} \
            DEPLOY_CORS_ORIGINS=${{ secrets.OVH_PUBLIC_ORIGIN }} \
              bash deploy/deploy.sh

      - name: 部署结果
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ OVH 生产部署成功 (backend: ${{ needs.resolve-tag.outputs.backend_tag }}, frontend: ${{ needs.resolve-tag.outputs.frontend_tag }})"
          else
            echo "❌ OVH 生产部署失败"
          fi
