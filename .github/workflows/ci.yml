name: PR Tests

on:
  pull_request:
  # push 只覆盖没有 PR 的分支(main / release-v*)。
  # 功能分支由 pull_request 事件覆盖 —— 之前 push 的分支列表里也有 feat/** fix/** 等,
  # 于是一个 PR 会同时被 push 和 pull_request 触发,跑两遍完全相同的 pytest;
  # 而 concurrency key 用的是 github.ref(push 是 refs/heads/xxx、PR 是 refs/pull/N/merge),
  # 两者不相等,互相取消不掉。
  push:
    branches: ["main", "release-v**"]

# 同分支多次 push 只保留最新一个
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (PG 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: overseas_supply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/overseas_supply_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/overseas_supply_test
      JWT_SECRET_KEY: ci-test-secret-key-do-not-use-in-production-1234567890

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --frozen --extra dev

      - name: Run tests
        working-directory: backend
        run: |
          source .venv/bin/activate
          pytest -v --tb=short

      - name: Test database migration (alembic upgrade head)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/overseas_supply_test
          SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/overseas_supply_test
        run: |
          source .venv/bin/activate
          echo "🔄 Testing database migration with real PostgreSQL..."
          sleep 2
          alembic upgrade head
          echo "✅ Migration test passed!"
          alembic current

  frontend:
    name: 前端构建 + 依赖审计
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # 版本跟 frontend/package.json 的 packageManager 对齐,别在这写死第二份。
      # 必须显式指路径:仓库根没有 package.json,而 defaults.working-directory
      # 只作用于 run 步骤、不作用于 uses。
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.18"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile: lockfile 与 package.json 不一致直接失败,
      # 防止「本地能装、CI 装出另一套依赖」
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next build 自带 tsc 类型检查 + eslint(next.config 没关这两项),
      # 所以不再单独跑 tsc --noEmit
      - name: Build
        run: pnpm build

      # 只审生产依赖:devDependencies 的洞不进公网产物。
      # 门槛定在 high —— 前台是公网 C 端,2026-07 那次积压到 33 条
      # (含 RSC 反序列化 DoS)就是因为没有任何机制会报警。
      # 出现不可利用的告警时,走 package.json 的 pnpm.overrides 显式豁免
      # (nanoid 那条就是这么处理的),而不是把门槛调松。
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
